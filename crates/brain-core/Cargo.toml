[package]
name = "brain-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# brain-core is no_std by construction (task 1.4). This is not a portability
# exercise — it is the enforcement mechanism for the purity boundary. Under
# no_std, `std::time::SystemTime`, `std::fs` and friends are not nameable, so a
# clock or a filesystem handle cannot reach the fold even by accident.
#
# Anything needing a clock, entropy or the filesystem takes it as a VALUE at the
# boundary. See DESIGN.md D12.

[dependencies]
minicbor = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true, default-features = false, features = ["alloc"] }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
any_ascii = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
minicbor = { workspace = true }
# Integration tests link std; the library itself remains no_std.
brain-core = { path = ".", features = ["std"] }

[features]
default = []
# `std` exists only so tests and benches can run; it must never be a default,
# and no non-test code may depend on it.
std = ["blake3/std", "ed25519-dalek/std"]
# Synthetic event-set generation. Consumed by this crate's own property tests
# and by brain-store's — the rules it exercises need several devices, and there
# is one.
testing = []
