[package]
name = "brain-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The recognizer's vocabulary (DESIGN.md §3.1.5). Tables and shapes only — the
# parser over them is M2. `no_std` and dependency-free for the same reason
# brain-core is: the language a capture is read in must not be able to depend on
# a clock, a locale, or the filesystem, or the same note parses differently on
# two devices.

[dependencies]
# The recogniser resolves "thursday 2pm" against a moment and a zone, which is
# what brain-time exists to do. It cannot reach a clock either — the current
# instant arrives as an argument, so a parse is reproducible.
brain-core = { path = "../brain-core" }
brain-time = { path = "../brain-time" }
