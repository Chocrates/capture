[package]
name = "capture-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# capture-store is the boundary crate: it owns SQLite, entropy, the clock and the
# filesystem, and it hands capture-core values rather than handles.

[dependencies]
capture-parse = { path = "../capture-parse" }
capture-time = { path = "../capture-time" }
# The wire types and the protocol. Whether the network comes with them is the
# `mdns` feature below: a crate that only prints a timeline should not link a
# responder to do it.
capture-sync = { path = "../capture-sync" }
capture-core = { path = "../capture-core", features = ["std"] }
# Naming blobs by their content (§5.6). The same hash the event ids use, so a
# device has one implementation of "what these bytes are called".
blake3 = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
minicbor = { workspace = true }
rusqlite = { workspace = true }
# To compute the public half of the device's Noise key. The secret is thirty-two
# random bytes from `entropy`; this turns it into something a peer can name.
x25519-dalek = { workspace = true }
rustix = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# To answer "which network is this" and "where can a peer reach me" with
# something true. A sync round advertises both.
if-addrs = { workspace = true }

[features]
# Browse and advertise. Off by default, because `round` is useful without it
# — a device with a remembered address syncs over TCP alone, which is the
# fallback for every network that blocks multicast.
mdns = ["capture-sync/mdns"]

[dev-dependencies]
proptest = { workspace = true }
# Only to write a projection the way an older build would have, so a test can
# prove such a thing still opens.
rusqlite = { workspace = true }
capture-parse = { path = "../capture-parse" }
capture-time = { path = "../capture-time" }
capture-core = { path = "../capture-core", features = ["std", "testing"] }
