[package]
name = "brain-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The wire, and nothing else (DESIGN.md §5).
#
# This crate owns the protocol and the socket. It hands `brain-store` verified
# envelopes; it does not fold, does not decide what an event means, and never
# touches the projection. The boundary is where an unreproducible bug becomes a
# reproducible one: everything on this side of it can be exercised over an
# in-memory transport, and everything on the other side already could be.

[dependencies]
# Without `std`, which brain-core's own manifest reserves for tests and benches:
# "no non-test code may depend on it".
brain-core = { path = "../brain-core" }
minicbor = { workspace = true }
# Noise_KK. The handshake state machine, nonce handling and rekeying are not
# ours to get subtly wrong (DESIGN.md §5.2).
snow = { workspace = true }
# Keyed hashing for the advertised pseudonym and digest (§5.2).
blake3 = { workspace = true }
# Optional: only the daemon browses a network. Keeping it behind a feature
# means the CLI, which links this crate for the protocol types, does not pull
# in a network stack to print a timeline.
mdns-sd = { version = "0.21.0", default-features = false, optional = true }
spake2 = "0.4.0"

[dev-dependencies]
# To build the static keypairs a handshake needs, the way the roster holds them.
x25519-dalek = { workspace = true }
brain-core = { path = "../brain-core", features = ["std", "testing"] }
proptest = { workspace = true }

[features]
default = []
# Discovery over the local network.
mdns = ["dep:mdns-sd"]
