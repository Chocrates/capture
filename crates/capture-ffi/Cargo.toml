[package]
name = "capture-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A C-compatible dynamic library, because that is what Android loads, plus an
# rlib so the generator and the tests can link it as an ordinary crate.
[lib]
crate-type = ["cdylib", "rlib"]
name = "capture_ffi"

[dependencies]
# With the network. This is the only consumer that has no daemon beside it:
# on Android there is no resident process to sync, so the round runs here.
capture-store = { path = "../capture-store", features = ["mdns"] }
capture-core = { path = "../capture-core", features = ["std"] }
capture-time = { path = "../capture-time" }
# To read one field out of an event body the projection does not keep.
minicbor = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
capture-parse = { path = "../capture-parse" }
# To read the log directly. A test that pairing wrote no `setting` has to look
# at the events, not at the surface — the surface is what would be wrong.
capture-store = { path = "../capture-store", features = ["mdns"] }
capture-core = { path = "../capture-core", features = ["std"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
