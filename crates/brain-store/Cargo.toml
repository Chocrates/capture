[package]
name = "brain-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# brain-store is the boundary crate: it owns SQLite, entropy, the clock and the
# filesystem, and it hands brain-core values rather than handles.

[dependencies]
brain-parse = { path = "../brain-parse" }
brain-time = { path = "../brain-time" }
brain-core = { path = "../brain-core", features = ["std"] }
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
minicbor = { workspace = true }
rusqlite = { workspace = true }
# To compute the public half of the device's Noise key. The secret is thirty-two
# random bytes from `entropy`; this turns it into something a peer can name.
x25519-dalek = { workspace = true }
rustix = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Only to write a projection the way an older build would have, so a test can
# prove such a thing still opens.
rusqlite = { workspace = true }
brain-parse = { path = "../brain-parse" }
brain-time = { path = "../brain-time" }
brain-core = { path = "../brain-core", features = ["std", "testing"] }
