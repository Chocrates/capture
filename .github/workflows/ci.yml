name: ci

# The cross-platform claims in this project are not verifiable from one machine.
# "The same logical event encodes identically on two platforms" is a statement
# about two platforms, and the golden vectors are only enforcement if something
# actually runs them somewhere else.
#
# Three jobs:
#   linux         every gate `make ci` runs locally, on the platform it was written on
#   macos         the workspace suite on Apple silicon
#   macos-build   release binaries for a Mac that cannot build them itself
#                 (it-runs-on-a-mac), as a downloadable artifact. Independent of
#                 the tests, so a failing Mac test does not withhold the binaries
#                 that would show what fails.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI should post a desktop notification.
  CAPTURE_SILENT: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries and the shells the terminal tests drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config zsh sqlite3 mold
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make ci

  macos:
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p capture-cli -p capture-overlay -p capture-syncd -p capture-desktop -p capture-alerts
      - name: Package
        # A tarball, because an artifact is a zip and a zip drops the
        # executable bit. install.sh goes in too: next to built binaries it
        # installs them instead of building.
        run: |
          mkdir -p dist/capture-macos-arm64
          cp target/release/capture target/release/capture-overlay \
             target/release/capture-syncd target/release/capture-desktop \
             dist/capture-macos-arm64/
          tools/mac-bundle target/release/capture-alerts dist/capture-macos-arm64
          cp install.sh docs/macos-test.md docs/doctor-codes.md dist/capture-macos-arm64/
      - name: The alert app runs and reads its settings
        # Nothing is asked or posted (--settings). A runner has nobody to
        # allow it, so a fail line is expected; a crash is not.
        run: |
          set +e
          "dist/capture-macos-arm64/Capture Alerts.app/Contents/MacOS/capture-alerts" --settings
          code=$?
          [ "$code" -le 1 ] || { echo "capture-alerts crashed ($code)"; exit 1; }
          tar -C dist -czf capture-macos-arm64.tar.gz capture-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: capture-macos-arm64
          path: capture-macos-arm64.tar.gz
          retention-days: 30

  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries the desktop app and overlay link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config mold
      - run: cargo build --release -p capture-cli -p capture-overlay -p capture-syncd -p capture-desktop
      - name: Package
        # Built on Ubuntu 24.04, so it needs glibc 2.39 or newer and the
        # webkit2gtk-4.1 runtime on the machine it runs on.
        run: |
          mkdir -p dist/capture-linux-x86_64
          cp target/release/capture target/release/capture-overlay \
             target/release/capture-syncd target/release/capture-desktop \
             dist/capture-linux-x86_64/
          tar -C dist -czf capture-linux-x86_64.tar.gz capture-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: capture-linux-x86_64
          path: capture-linux-x86_64.tar.gz
          retention-days: 30
