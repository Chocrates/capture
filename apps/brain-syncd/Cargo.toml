[package]
name = "brain-syncd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The protocol, and this time with the network: this is the one binary that
# browses and dials.
brain-sync = { path = "../../crates/brain-sync", features = ["mdns"] }
brain-store = { path = "../../crates/brain-store" }
brain-core = { path = "../../crates/brain-core", features = ["std"] }
minicbor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jiff = { workspace = true }
# For the two signals that beat the timer: logind's resume and
# NetworkManager's state change. Blocking API, one thread each.
zbus = { workspace = true }
# To answer "which network is this" and "where can I be reached" with something
# true. Already in the tree under mdns-sd; named here because this crate uses
# it directly.
if-addrs = "0.15"

[[bin]]
name = "brain-syncd"
path = "src/main.rs"
