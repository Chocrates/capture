[workspace]
resolver = "3"
members = [
    "crates/capture-core",
    "crates/capture-parse",
    "crates/capture-time",
    "crates/capture-store",
    "crates/capture-sync",
    "crates/capture-ffi",
    "apps/capture-cli",
    "apps/capture-overlay",
    "apps/capture-syncd",
    "apps/capture-desktop",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# Which network this is, and where a peer can reach us. Named here rather than
# per-crate because two crates asking the same question of the same machine
# must not be able to answer it with two different versions.
if-addrs = "0.15"

# --- frozen primitives (group 2). Versions pinned: the encoding is permanent. ---
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
# The Diffie-Hellman half of a device's identity, kept separate from the
# signing half: one key doing both is what cryptographic hygiene warns about.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# Noise_KK for the sync transport (DESIGN.md §5.2). The handshake state
# machine, nonce handling and rekeying are not ours to get subtly wrong.
snow = "0.10"

# --- Android bindings (group M4). ---
#
# uniffi generates the Kotlin the phone calls. Hand-written JNI for a surface
# this size would be a permanent tax, and every hand-written binding is a place
# where the two sides can disagree about a type without either failing to
# compile.
uniffi = "0.32"

# Slug derivation (task 2.11). Pinned exactly: their Unicode tables are part of
# the frozen algorithm — a table change would silently alter existing slugs on
# the next rebuild and break every hand-written link.
unicode-normalization = { version = "=0.1.25", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false }
any_ascii = { version = "=0.3.3", default-features = false }

# --- storage (group 5) ---
rusqlite = { version = "0.37", features = ["bundled"] }
# Advisory locking (task 5.14). The kernel releases a flock when the holding
# process dies, which a pid file cannot do — a crashed writer would otherwise
# leave the store locked with nothing able to tell a stale lock from a live one.
rustix = { version = "1", features = ["fs", "process"] }

# --- the overlay (group 8) ---
# Default features are trimmed: the overlay is a single text field that must
# appear instantly, so it takes the glow renderer and skips persistence,
# accesskit and the default icon loaders.
#
# It does not take `default_fonts`, and that is not free: without it egui has no
# font data at all, so every galley comes back empty. The field renders as a
# one-pixel line, typed characters never appear, and — because the cursor is
# clamped against that empty galley on the frame after each keystroke — every
# new character lands at position zero and the note is stored backwards. The
# overlay loads a font from the system instead; see `window::fonts`.
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11"] }

# Pinned to the version eframe uses, because the overlay has to reach past
# eframe to choose the windowing backend itself. See `window.rs`: on Wayland
# winit cannot hide a window, raise it, or give it the keyboard, and those are
# the only three things this window does.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

# The X11 hotkey backend (task 8.8). Already in the tree as winit's X11
# transport, and pinned to the same version so the overlay is not linking two
# copies of an X connection.
x11rb = { version = "0.13", default-features = false }

# The portal hotkey backend (task 8.7). The `GlobalShortcuts` interface needs a
# live D-Bus connection rather than a one-shot call: the reply to CreateSession
# arrives as a signal on a separate object, and activations arrive as signals
# forever after. That rules out shelling out to `gdbus`, which is fine for the
# capability probe in `hotkey.rs` and cannot subscribe before it calls.
#
# The blocking API, deliberately: the overlay already has an event loop it does
# not own, and adding an async runtime alongside it would be a second scheduler
# for one subscription. This runs on its own thread and blocks on it.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# --- time (group M2). ---
#
# Taken without default features so neither can reach a clock: `chrono`'s
# `Local` and `Utc::now` live behind `std`/`clock`, and `chrono-tz` embeds the
# IANA database rather than reading /usr/share/zoneinfo at runtime. That is what
# lets capture-time stay no_std while still answering the only question that
# matters for expansion — what the offset was at a given local time in a given
# zone, and whether that local time existed once, twice, or not at all.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false }

# --- host-side only ---
getrandom = "0.3"
jiff = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# --- dev ---
proptest = "1"

# Optimised, but not at any price in build time.
#
# This was `lto = true` with `codegen-units = 1` — the slowest configuration
# there is — and nothing recorded why. Measured on one changed line in
# `capture-store`, rebuilding the three binaries:
#
#     lto = true,   codegen-units = 1     220 s
#     lto = "thin", codegen-units = 16    120 s
#     the same, plus a faster linker        87 s  (see .cargo/config.toml)
#
# Nothing here is waiting on the optimiser. The one budget this project
# measures is the capture gesture — 150 ms in §3.1, met in 2 ms — and it is
# identical under both settings: 95% within 2 ms either way. The real work is
# SQLite and a webview. Fat LTO was buying optimisation nothing was short of
# and charging a hundred seconds an iteration for it.
#
# What it costs is size: `capture-overlay` goes from 16 MB to 21.5 MB. Nothing is
# distributed yet, so that is cheap — and if it ever matters, the answer is a
# separate profile with `lto = true` for the build that ships, rather than
# paying for it on every rebuild during development.
[profile.release]
lto = "thin"
codegen-units = 16
