# Where the SDK is, resolved by tools/android-env.sh rather than expected in
# the environment. `local.properties` is the conventional home for this and is
# deliberately not in version control, because it is a path on one machine.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
