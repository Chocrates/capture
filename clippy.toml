# Purity enforcement for brain-core (task 1.4, DESIGN.md D12).
#
# `no_std` already makes std::time and std::fs unnameable in brain-core. These
# catch what the type system does not: crates that reach for a clock or entropy
# without going through std.
#
# The rule being defended: the fold takes the event set and nothing else. Two
# earlier design drafts broke it in ways that looked like fixes — filtering
# future-dated events out of the projection, and clamping incoming timestamps —
# and neither would have been caught by a test, because a test cannot easily
# observe "this function could have taken a clock".

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "the fold takes the event set and nothing else; pass an HLC stamp in at the boundary" },
    { path = "std::time::Instant::now", reason = "no wall-clock or monotonic reads below the boundary" },
    { path = "getrandom::fill", reason = "entropy is produced in brain-store and passed in as a Nonce or Incarnation" },
    { path = "rand::random", reason = "entropy is produced in brain-store and passed in as a Nonce or Incarnation" },
]

disallowed-types = [
    { path = "std::time::SystemTime", reason = "clocks do not cross the purity boundary" },
    { path = "std::time::Instant", reason = "clocks do not cross the purity boundary" },
]
