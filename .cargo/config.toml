# mold, which links this workspace's binaries.
#
# The release profile's own settings are the larger lever and are measured in
# the note above `[profile.release]` in Cargo.toml: 220 s for a one-line change
# became 120 s there, and 94 s once the gold linker was added. mold replaces
# gold here and is expected to take more off again — expected rather than
# measured, and it should be measured before that claim is repeated anywhere.
#
# Applies to every profile, so `cargo test` and the debug builds get it too.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
